name: Bug report
description: Report functionality, visual, or compatibility issues with JEIU. For crashes, use the crash report template.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        This repository maintains JEIU, an unofficial fork of JEI. Report JEIU-specific issues here.
        Provide enough detail to reproduce the issue. Source code analysis or identifying the root cause is not required.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and found no duplicate. If the issue is already reported, I will add information to that report instead.
          required: true
        - label: I confirm that I am using JEIU, not official JEI.
          required: true

  - type: input
    id: jeiu_version
    attributes:
      label: JEIU version
      description: Enter the full version number or JAR filename, not just "latest".
      placeholder: JEIunofficial-1.21.1-neoforge-19.54.0.426.jar
    validations:
      required: true

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft version
      placeholder: 1.21.1
    validations:
      required: true

  - type: input
    id: loader_version
    attributes:
      label: Mod loader and version
      description: Include both the loader name and its full version number.
      placeholder: NeoForge 21.1.xxx or Forge 47.x.x
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Game environment
      options:
        - Singleplayer
        - Multiplayer server
        - LAN multiplayer
        - Other (describe in Additional information)
    validations:
      required: true

  - type: dropdown
    id: server_installation
    attributes:
      label: Is JEIU installed on the server?
      description: Leave blank for singleplayer. Select "Unknown" if you do not know the server setup.
      options:
        - Installed (include the server's JEIU version in Additional information)
        - Not installed
        - Unknown

  - type: dropdown
    id: latest_version
    attributes:
      label: Have you tested the latest JEIU release for your Minecraft version and loader?
      description: Updating your modpack is not required to submit a report.
      options:
        - Tested, the issue still occurs
        - Tested, the issue no longer occurs
        - Not tested or unsure

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: Describe what happens, including the items, recipes, or screens involved. Screenshots can be attached here.
      placeholder: Holding Shift while hovering over a recipe in the lookup history shows two overlapping tooltips.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what should happen. For quantity issues, include both the actual and expected amounts.
      placeholder: Only one pinned recipe preview should appear, allowing me to move the cursor into it to inspect ingredients.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Specify the starting screen, cursor position, keys pressed, and order of actions. Use specific items where possible.
        Intermittent issues can also be reported. Describe how often the issue occurs and what you were doing at the time.
        For visual or interaction issues, a short video showing the full sequence is recommended.
      placeholder: |
        1. Open the ... screen.
        2. Bookmark the recipe for ... and click the bookmark to view it.
        3. Hover over ... in the lookup history and hold ... .
        4. ... happens every time / occasionally.
    validations:
      required: true

  - type: textarea
    id: affected_mods
    attributes:
      label: Related mods and versions (optional)
      description: List the mods involved and their versions, or provide your mod list if unsure. You do not need to identify which mod is responsible.

  - type: textarea
    id: modpack
    attributes:
      label: Modpack information (optional)
      description: Include the name, version, and download link. Note any added or removed mods, or changes to configs or recipes.

  - type: dropdown
    id: official_jei
    attributes:
      label: Comparison with official JEI (optional)
      description: Replacing JEIU is not required to submit a report. If you tested official JEI, include its version in Additional information.
      options:
        - Works with official JEI; the issue only occurs with JEIU
        - The same issue occurs with official JEI
        - Not tested
        - JEIU-specific feature; no direct comparison is possible

  - type: textarea
    id: attachments
    attributes:
      label: Logs and attachments (optional)
      description: |
        Upload logs/latest.log from the session where the issue occurred, or provide a log link. A launcher error dialog alone is not sufficient.
        For bookmark, recipe chain, or collapsible group issues, also consider attaching the relevant bookmark data, rule files, or configs.
        Drag files, screenshots, or videos into this field. Unsupported file types can be packaged as a ZIP.
        Check attachments for private information before uploading. Redact anything you do not want to share while preserving the error context where possible.

  - type: textarea
    id: additional_information
    attributes:
      label: Additional information (optional)
      description: Include troubleshooting steps, workarounds, behavior in other versions, or possible causes. Source code analysis is not required.
